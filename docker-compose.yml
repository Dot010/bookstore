services:
  db:
    image: postgres:17
    env_file: .env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore_dev"]
      interval: 5s
      retries: 10
    networks:
      - bookstore_net

  web:
    build: .
    env_file: .env.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookstore_net

volumes:
  postgres_data:

networks:
  bookstore_net:
    driver: bridge